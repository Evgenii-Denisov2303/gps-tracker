name: gps-tracker-tests
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: tracker_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tracker:test-only-password@test-db:5432/tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://tracker:test-only-password@test-db:5432/tracker_test
      PUBLIC_ORIGIN: http://localhost:8000
      COOKIE_SECURE: "false"
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "python -m pip install --user --no-cache-dir -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider && python -m alembic upgrade head && python -m alembic check"]
